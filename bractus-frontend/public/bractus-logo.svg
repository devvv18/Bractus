<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="20" y1="20" x2="20" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#078462"/>
      <stop offset="100%" stop-color="#013F4A"/>
    </linearGradient>
  </defs>

  <!--
    The Bractus icon is two stacked rounded chevron shapes forming a stylized B.
    Top half: outer outline of top chevron (pointing right)
    Bottom half: inner detail forming lower chevron
  -->

  <!-- Outer top-right chevron -->
  <path
    d="M24 24
       Q20 24 20 28
       L20 52
       Q20 58 26 62
       L68 82
       L26 102
       Q20 106 20 112
       L20 136
       Q20 140 24 140
       Q28 140 32 137
       L90 107
       Q104 100 104 82
       Q104 64 90 57
       L32 27
       Q28 24 24 24 Z"
    fill="url(#iconGrad)"
    opacity="0.15"
  />

  <!-- Icon strokes: two chevrons -->
  <!-- Top outer chevron -->
  <path
    d="M28 32 L82 70 L28 108"
    stroke="url(#iconGrad)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Bottom inner chevron -->
  <path
    d="M52 56 L96 80 L52 108"
    stroke="url(#iconGrad)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Wordmark -->
  <text
    x="128"
    y="108"
    font-family="'Inter', 'Nunito', 'Segoe UI', sans-serif"
    font-size="80"
    font-weight="700"
    fill="#013F4A"
    letter-spacing="-2"
  >Bractus</text>
</svg>
